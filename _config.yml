user_description: I am a doctoral student in the [Department of Linguistics](https://as.nyu.edu/departments/linguistics.html?challenge=d06e90d7-4d8f-4b88-9d8c-10b73beb60f1) at New York University. I am interested in how language is acquired by children, how sentence structure interacts with meaning in context and how language relates to human cognition. I am a member of the NYU Child Language Lab, directed by Ailís Cournane. Before coming to NYU, I did my BA and MA studies at the University of Crete, where I wrote an MA thesis on 'The development of wishes is child Greek', supervised by Vina Tsakali.
