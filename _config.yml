user_title: "I'm (the website of) Irini Amanaki, a PhD student of Linguistics at NYU."
user_description: "I study how children understand and express meaning through language. My research focuses on logical language development and how children learn to represent mental states such as thoughts, beliefs, and desires. I'm a member of the <a href='https://www.childlanguagelab.com/'>NYU Child Language Lab</a> 🦖 and I'm supervised by Ailís Cournane. Before coming to <a href='https://as.nyu.edu/departments/linguistics.html'>NYU</a>, I completed my BA and MA studies at the <a href='https://www.philology.uoc.gr/en/department/divisions/linguistics'>University of Crete</a>, where I wrote my MA thesis, 'The development of wishes in child Greek', supervised by Vina Tsakali."
