intro_title: Hello!
I am interested in how language is acquired by children, how sentence structure interacts with meaning in context and how language relates to human cognition. I am a member of the NYU Child Language Lab, directed by Ailís Cournane. Before coming to NYU, I did my BA and MA studies at the University of Crete, where I wrote my MA thesis on 'The development of wishes is child Greek', advised by Vina Tsakali.
